- name: Actualizar codigo desde ZIP
  run: |
    mkdir temp_nuevo
    unzip -o tu_archivo_nuevo.zip -d temp_nuevo
    # Copia solo el codigo nuevo (ej. src o www) sin tocar android/ ni .github/
    cp -rf temp_nuevo/* ./
    rm -rf temp_nuevo tu_archivo_nuevo.zip
    git config user.name "GitHub Action"
    git config user.email "action@github.com"
    git add .
    git commit -m "Actualizacion masiva desde ZIP"
    git push
    
