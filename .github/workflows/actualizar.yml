name: Actualizar App desde ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer-y-actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Limpiar codigo fuente viejo y extraer ZIP nuevo
        run: |
          mkdir temp_nuevo
          unzip -o *.zip -d temp_nuevo
          rm -rf app/src
          cp -rf temp_nuevo/app/src app/ 2>/dev/null || true
          cp -rf temp_nuevo/src app/ 2>/dev/null || true
          rm -rf temp_nuevo *.zip

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Actualizacion limpia de app/src desde ZIP" || exit 0
          git push
          
